name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libglib2.0-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "shot-agent ${{ github.ref_name }}"
          releaseBody: |
            桌面版安装包已自动构建完成。

            下载对应系统的安装包后即可使用：
            - macOS：下载 `.dmg` 或 `.app.tar.gz`
            - Windows：下载 `.msi` 或 `.exe`
            - Linux：下载 `.AppImage` 或 `.deb`

            首次启动会自动使用系统默认应用数据目录下的 `shotAgent` 文件夹保存画布和素材，也可以在应用内重新选择存储目录。
          releaseDraft: true
          prerelease: false
