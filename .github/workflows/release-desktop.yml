name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libglib2.0-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "shot-agent ${{ github.ref_name }}"
          releaseBody: |
            桌面应用下载说明

            请根据你的操作系统选择对应安装包：

            - macOS：下载 `macos` / `.dmg` / `.app.tar.gz` 相关文件
            - Windows：下载 `windows` / `.msi` / `.exe` 相关文件
            - Linux：下载 `linux` / `.AppImage` / `.deb` / `.rpm` 相关文件

            若同一平台提供多个文件，请优先选择常用安装包格式：

            - macOS：优先下载 `.dmg`
            - Windows：优先下载 `.msi`
            - Linux：
              - Ubuntu / Debian 优先下载 `.deb`
              - Fedora / CentOS / RHEL 优先下载 `.rpm`
              - 不确定发行版时可优先尝试 `.AppImage`

            如果系统提示“来自未知开发者”或安全警告，请根据本机系统提示确认后再安装。
          releaseDraft: true
          prerelease: false
