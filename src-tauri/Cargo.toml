[package]
name = "shot-agent"
version = "0.1.0"
description = "shot-agent desktop shell"
authors = ["shot-agent contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/TCmatj/shot-agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shot_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
