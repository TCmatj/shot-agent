services:
  shot-agent-server:
    build:
      context: ./apps/server
    env_file:
      - ./apps/server/.env
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
